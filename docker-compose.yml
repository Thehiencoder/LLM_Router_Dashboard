services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: llm_router_backend
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 3
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: llm_router_frontend
    restart: unless-stopped
    ports:
      # Exposes the web app on port 3000 (accessible as http://<IP>:3000)
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network

  # Optional Public Tunnel: Run with `docker compose --profile tunnel up -d`
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:latest
    container_name: llm_router_tunnel
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:80
    depends_on:
      - frontend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
